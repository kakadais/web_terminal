map $http_upgrade $web_terminal_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name terminal.digix.kr;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/web-terminal-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://terminal.digix.kr$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name terminal.digix.kr;
    ssl_certificate /etc/letsencrypt/live/terminal.digix.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/terminal.digix.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:web_terminal_tls:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    client_max_body_size 1m;
    client_body_timeout 30s;

    location = /terminal/upload {
        client_max_body_size 1024m;
        client_body_timeout 600s;
        proxy_pass http://192.168.1.4:5160;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://192.168.1.4:5160;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $web_terminal_connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_send_timeout 75s;
        proxy_read_timeout 90s;
        proxy_request_buffering off;
        proxy_buffering off;
    }
}
