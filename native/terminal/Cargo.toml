[package]
name = "web-terminal-pty"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
libc = "0.2"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.4"
sysinfo = { version = "0.40", default-features = false, features = ["system"] }

[profile.release]
lto = "thin"
strip = true
